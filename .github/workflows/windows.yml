name: Windows portable
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Arconte.sln
      - name: Build
        run: dotnet build Arconte.sln -c Release --no-restore
      - name: Tests (synthetic temporary data only)
        run: dotnet test Arconte.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Dependency audit
        run: dotnet list Arconte.sln package --vulnerable --include-transitive | Tee-Object -FilePath dependency-audit.txt
      - name: Publish and package
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Arconte-v0.2.0-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            TestResults/*.trx
            dependency-audit.txt
